<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Marketplace - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .login-box{
            width:400px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px lightgray;
        }
    </style>

</head>
<body>

<div class="login-box">

    <h2 class="text-center mb-4">Campus Marketplace</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-warning">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label>Email</label>

            <input
                type="email"
                class="form-control"
                name="email"
                required
            >
        </div>

        <div class="mb-3">
            <label>Password</label>

            <input
                type="password"
                class="form-control"
                name="password"
                required
            >
        </div>

        <button
            class="btn btn-primary w-100">
            Login
        </button>

    </form>

    <hr>

    <p class="text-center">
        Don't have an account?

        <a href="/register">
            Register
        </a>
    </p>

</div>

</body>
</html>

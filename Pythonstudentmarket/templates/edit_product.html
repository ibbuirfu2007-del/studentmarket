<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-primary text-white">
            <h3>Edit Product</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>

                    <input
                        type="text"
                        name="product_name"
                        class="form-control"
                        value="{{ product[1] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        required>{{ product[2] }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>

                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        value="{{ product[3] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price</label>

                    <input
                        type="number"
                        name="price"
                        class="form-control"
                        value="{{ product[4] }}"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Product
                </button>

                <a href="/dashboard" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
